<svg width="150" height="150" viewBox="0 0 150 150" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gradient-coach-male-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1f2937;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#111827;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="150" height="150" fill="url(#gradient-coach-male-1)" rx="75"/>
  <g transform="translate(75,75)">
    <!-- Male coach silhouette -->
    <circle cx="0" cy="-20" r="18" fill="rgba(255,255,255,0.8)"/>
    <!-- Suit jacket -->
    <path d="M-15 -5 L-15 30 L15 30 L15 -5 Q15 -8 12 -8 L-12 -8 Q-15 -8 -15 -5 Z" fill="rgba(255,255,255,0.8)"/>
    <!-- Tie -->
    <path d="M-2 -8 L-2 20 L0 25 L2 20 L2 -8 Z" fill="rgba(255,255,255,0.6)"/>
    <!-- Arms -->
    <rect x="-20" y="-2" width="5" height="20" rx="2.5" fill="rgba(255,255,255,0.8)"/>
    <rect x="15" y="-2" width="5" height="20" rx="2.5" fill="rgba(255,255,255,0.8)"/>
    <!-- Legs (dress pants) -->
    <rect x="-8" y="30" width="6" height="20" rx="3" fill="rgba(255,255,255,0.8)"/>
    <rect x="2" y="30" width="6" height="20" rx="3" fill="rgba(255,255,255,0.8)"/>
    <!-- Clipboard -->
    <rect x="20" y="5" width="8" height="12" rx="1" fill="rgba(255,255,255,0.9)" stroke="rgba(0,0,0,0.2)" stroke-width="0.5"/>
    <line x1="22" y1="8" x2="26" y2="8" stroke="rgba(0,0,0,0.3)" stroke-width="0.3"/>
    <line x1="22" y1="10" x2="26" y2="10" stroke="rgba(0,0,0,0.3)" stroke-width="0.3"/>
    <line x1="22" y1="12" x2="24" y2="12" stroke="rgba(0,0,0,0.3)" stroke-width="0.3"/>
  </g>
</svg>
