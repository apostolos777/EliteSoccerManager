<svg width="150" height="150" viewBox="0 0 150 150" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gradient-coach-female-2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0891b2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0e7490;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="150" height="150" fill="url(#gradient-coach-female-2)" rx="75"/>
  <g transform="translate(75,75)">
    <!-- Female coach silhouette -->
    <circle cx="0" cy="-20" r="18" fill="rgba(255,255,255,0.8)"/>
    <!-- Longer hair -->
    <ellipse cx="-8" cy="-25" rx="3" ry="10" fill="rgba(255,255,255,0.7)"/>
    <ellipse cx="8" cy="-25" rx="3" ry="10" fill="rgba(255,255,255,0.7)"/>
    <!-- Sport jacket -->
    <path d="M-12 -5 Q-12 -8 -9 -8 L9 -8 Q12 -8 12 -5 L12 30 L-12 30 Z" fill="rgba(255,255,255,0.8)"/>
    <!-- Arms -->
    <rect x="-17" y="-2" width="5" height="18" rx="2.5" fill="rgba(255,255,255,0.8)"/>
    <rect x="12" y="-2" width="5" height="18" rx="2.5" fill="rgba(255,255,255,0.8)"/>
    <!-- Legs (sport pants) -->
    <rect x="-6" y="30" width="5" height="18" rx="2.5" fill="rgba(255,255,255,0.8)"/>
    <rect x="1" y="30" width="5" height="18" rx="2.5" fill="rgba(255,255,255,0.8)"/>
    <!-- Whistle -->
    <circle cx="-20" cy="8" r="2" fill="rgba(255,255,255,0.9)" stroke="rgba(0,0,0,0.2)" stroke-width="0.3"/>
    <line x1="-20" y1="10" x2="-12" y2="5" stroke="rgba(255,255,255,0.7)" stroke-width="0.5"/>
  </g>
</svg>
