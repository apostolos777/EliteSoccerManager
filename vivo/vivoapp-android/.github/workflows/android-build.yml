name: Android Build

on:
  push:
    branches: [ main ]

jobs:
  build-android:
    runs-on: ubuntu-latest
    env:
      JAVA_VERSION: '17'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
        with:
          version: 8
      - name: Install deps
        run: pnpm install

      - name: Build API
        run: pnpm --filter api build

      - name: Expo prebuild Android (generate native project)
        run: npx expo prebuild --platform android --no-install

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Install Android SDK tools
        run: |
          sudo apt-get update && sudo apt-get install -y wget tar unzip
          yes | sdkmanager --install "platform-tools" "platforms;android-33" "build-tools;33.0.2"

      - name: Build Android APK (Gradle)
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug -Pandroid.injected.testOnly=false

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

  # Note: This job may require additional runner configuration and secrets for a reliable EAS/Expo build
