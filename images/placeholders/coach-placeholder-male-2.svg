<svg width="150" height="150" viewBox="0 0 150 150" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gradient-coach-male-2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#374151;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1f2937;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="150" height="150" fill="url(#gradient-coach-male-2)" rx="75"/>
  <g transform="translate(75,75)">
    <!-- Male coach silhouette -->
    <circle cx="0" cy="-20" r="18" fill="rgba(255,255,255,0.8)"/>
    <!-- Tracksuit jacket -->
    <path d="M-14 -5 L-14 30 L14 30 L14 -5 Q14 -8 11 -8 L-11 -8 Q-14 -8 -14 -5 Z" fill="rgba(255,255,255,0.8)"/>
    <!-- Zipper line -->
    <line x1="0" y1="-8" x2="0" y2="15" stroke="rgba(255,255,255,0.6)" stroke-width="1"/>
    <!-- Arms -->
    <rect x="-19" y="-2" width="5" height="20" rx="2.5" fill="rgba(255,255,255,0.8)"/>
    <rect x="14" y="-2" width="5" height="20" rx="2.5" fill="rgba(255,255,255,0.8)"/>
    <!-- Legs (tracksuit pants) -->
    <rect x="-7" y="30" width="5" height="20" rx="2.5" fill="rgba(255,255,255,0.8)"/>
    <rect x="2" y="30" width="5" height="20" rx="2.5" fill="rgba(255,255,255,0.8)"/>
    <!-- Whistle -->
    <circle cx="-22" cy="8" r="2" fill="rgba(255,255,255,0.9)" stroke="rgba(0,0,0,0.2)" stroke-width="0.3"/>
    <line x1="-22" y1="10" x2="-15" y2="5" stroke="rgba(255,255,255,0.7)" stroke-width="0.5"/>
  </g>
</svg>
